services:
  api:
    build: ..
    restart: unless-stopped
    env_file: .env
    volumes:
      - hlth-data:/data
    expose:
      - "8080"
    mem_limit: 256m

  # VPN: VLESS + WebSocket, снаружи — тот же HTTPS 443 через Caddy (путь VPN_PATH).
  xray:
    image: teddysun/xray:latest
    restart: unless-stopped
    volumes:
      - ./xray.json:/etc/xray/config.json:ro
    expose:
      - "10000"
    ports:
      - "8443:8443"
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    mem_limit: 256m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api, xray]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      VPN_PATH: ${VPN_PATH:-/vpn-disabled}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m

volumes:
  hlth-data:
  caddy-data:
  caddy-config:
