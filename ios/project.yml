name: HLTH
options:
  bundleIdPrefix: com.tshk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "33"
    DEVELOPMENT_TEAM: ""
targets:
  HLTH:
    type: application
    platform: iOS
    sources: [HLTH]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tshk.hlthhbbty
        PRODUCT_NAME: HLTH
        INFOPLIST_FILE: HLTH/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: HLTH/HLTH.entitlements
        ENABLE_PREVIEWS: NO
