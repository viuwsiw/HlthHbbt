# Сборка IPA для iOS в Codemagic (запасной вариант к GitHub Actions).
workflows:
  ios-ipa:
    name: HLTH HBTy iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      events: [push]
      branch_patterns:
        - pattern: claude/quirky-goodall-is99zk
    when:
      changeset:
        includes: ['ios/']
    scripts:
      - name: Generate project
        script: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build
        script: |
          cd ios
          xcodebuild -project HLTH.xcodeproj -scheme HLTH -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" ; test ${PIPESTATUS[0]} -eq 0
      - name: Package IPA
        script: |
          cd ios
          APP=build/Build/Products/Release-iphoneos/HLTH.app
          for EXT in "$APP"/PlugIns/*.appex; do [ -d "$EXT" ] && codesign --force --sign - "$EXT"; done
          codesign --force --sign - --entitlements HLTH/HLTH.entitlements "$APP" || true
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry HLTH-HBTy-ios.ipa Payload
    artifacts:
      - ios/HLTH-HBTy-ios.ipa
      - ios/build.log
